# ==============================================================================
# Modular File Manager - Docker Compose Configuration
# ==============================================================================
# Complete centralized deployment with API, WebUI, PostgreSQL, and Redis
# ==============================================================================

# ------------------------------------------------------------------------------
# Networks
# ------------------------------------------------------------------------------
networks:
  file-manager-internal:
    driver: bridge
    name: file-manager-network
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ------------------------------------------------------------------------------
# Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres-data:
    driver: local
    name: file-manager-postgres-data

  redis-data:
    driver: local
    name: file-manager-redis-data

  elasticsearch-data:
    driver: local
    name: file-manager-elasticsearch-data

  logs:
    driver: local
    name: file-manager-logs

  config:
    driver: local
    name: file-manager-config

# ------------------------------------------------------------------------------
# Services
# ------------------------------------------------------------------------------
services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database (16-alpine)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: file-manager-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-filemanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-filemanager}
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      file-manager-internal:
        ipv4_address: 172.28.0.10

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-filemanager} -d ${POSTGRES_DB:-filemanager}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    ports:
      # Only expose for debugging - remove in production
      - "127.0.0.1:45432:5432"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Redis Cache (7-alpine)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: file-manager-redis
    restart: unless-stopped

    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-changeme}

    volumes:
      - redis-data:/data

    networks:
      file-manager-internal:
        ipv4_address: 172.28.0.11

    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    ports:
      # Only expose for debugging - remove in production
      - "127.0.0.1:46379:6379"

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Elasticsearch (8.x)
  # ----------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: file-manager-elasticsearch
    restart: unless-stopped

    environment:
      # Single-node cluster configuration (no security for internal network)
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.name: file-manager-cluster
      node.name: file-manager-node-1
      bootstrap.memory_lock: "true"

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    networks:
      file-manager-internal:
        ipv4_address: 172.28.0.12

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

    # No port exposure - internal only
    # ports:
    #   - "127.0.0.1:49200:9200"

    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # FastAPI Backend
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTHON_VERSION: 3.11
        BUILDKIT_INLINE_CACHE: 1

    container_name: file-manager-api
    restart: unless-stopped

    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-filemanager}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-filemanager}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-3600}
      DB_ECHO: ${DB_ECHO:-false}

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-50}

      # Elasticsearch
      ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-true}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      ELASTICSEARCH_INDEX_OPERATIONS: ${ELASTICSEARCH_INDEX_OPERATIONS:-rfm-operations}
      ELASTICSEARCH_INDEX_FILES: ${ELASTICSEARCH_INDEX_FILES:-rfm-files}
      ELASTICSEARCH_MAX_RETRIES: ${ELASTICSEARCH_MAX_RETRIES:-3}
      ELASTICSEARCH_TIMEOUT: ${ELASTICSEARCH_TIMEOUT:-30}

      # API Server
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_WORKERS: ${API_WORKERS:-4}
      API_RELOAD: ${API_RELOAD:-false}

      # Security
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_TO_RANDOM_64_BYTE_STRING}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_DAYS: ${ACCESS_TOKEN_EXPIRE_DAYS:-30}

      # TLS/SSL (self-signed certificate in container)
      TLS_ENABLED: ${TLS_ENABLED:-true}
      TLS_CERT_PATH: /etc/ssl/certs/filemanager.crt
      TLS_KEY_PATH: /etc/ssl/private/filemanager.key
      TLS_MIN_VERSION: ${TLS_MIN_VERSION:-1.3}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080,http://webui:3000}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      ENABLE_JSON_LOGS: ${ENABLE_JSON_LOGS:-true}
      LOG_FILE_PATH: /var/log/file-manager/api.log
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}

      # Worker settings
      WORKER_HEARTBEAT_INTERVAL: ${WORKER_HEARTBEAT_INTERVAL:-30}
      WORKER_HEARTBEAT_TIMEOUT: ${WORKER_HEARTBEAT_TIMEOUT:-90}
      WORKER_TIMEOUT: ${WORKER_TIMEOUT:-300}
      WORKER_RETRY_ATTEMPTS: ${WORKER_RETRY_ATTEMPTS:-3}

      # External integrations - PolkaSQL Authentication
      # Accepts both ENABLE_POLKA_AUTH and POLKA_AUTH_ENABLED from .env
      POLKA_AUTH_ENABLED: ${ENABLE_POLKA_AUTH:-${POLKA_AUTH_ENABLED:-false}}
      POLKA_AUTH_URL: ${POLKA_AUTH_URL:-}
      POLKA_AUTH_API_KEY: ${POLKA_AUTH_API_KEY:-}
      POLKA_AUTH_TIMEOUT: ${POLKA_AUTH_TIMEOUT:-5}

      # External integrations - Syslog
      ENABLE_SYSLOG: ${ENABLE_SYSLOG:-false}
      SYSLOG_HOST: ${SYSLOG_HOST:-}
      SYSLOG_PORT: ${SYSLOG_PORT:-514}
      SYSLOG_PROTOCOL: ${SYSLOG_PROTOCOL:-UDP}

      # External integrations - Remote Audit API
      ENABLE_REMOTE_AUDIT_API: ${ENABLE_REMOTE_AUDIT_API:-false}
      REMOTE_AUDIT_API_URL: ${REMOTE_AUDIT_API_URL:-}
      REMOTE_AUDIT_API_TOKEN: ${REMOTE_AUDIT_API_TOKEN:-}
      REMOTE_AUDIT_API_TIMEOUT: ${REMOTE_AUDIT_API_TIMEOUT:-5}

      # Application settings
      MAX_CONCURRENT_USERS: ${MAX_CONCURRENT_USERS:-4}
      OPERATION_TIMEOUT: ${OPERATION_TIMEOUT:-3600}
      ENABLE_AUTO_ROLLBACK: ${ENABLE_AUTO_ROLLBACK:-true}
      MAX_FILE_LISTING_ITEMS: ${MAX_FILE_LISTING_ITEMS:-1000}

      # VF Redesign: Global default paths (can be overridden per worker)
      PATH_B: ${PATH_B:-}
      PATH_C: ${PATH_C:-}

      # Development
      DEBUG: ${DEBUG:-false}
      SQL_ECHO: ${SQL_ECHO:-false}

    volumes:
      - logs:/var/log/file-manager
      - config:/etc/file-manager
      # Mount SSL certificates (generated at startup)
      - ./ssl:/etc/ssl/file-manager:ro

    networks:
      file-manager-internal:
        ipv4_address: 172.28.0.20

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

    ports:
      - "${API_HOST_PORT:-8000}:8000"
      - "${API_HOST_PORT_HTTPS:-8443}:8443"

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # WebUI (Static Files + Flask Proxy)
  # ----------------------------------------------------------------------------
  webui:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        PYTHON_VERSION: 3.11

    container_name: file-manager-webui
    restart: unless-stopped

    environment:
      # API Backend URL (internal network)
      API_URL: ${API_URL:-http://api:8000}
      API_URL_PUBLIC: ${API_URL_PUBLIC:-http://localhost:8000}

      # WebUI server
      WEBUI_HOST: 0.0.0.0
      WEBUI_PORT: 3000

      # Flask settings
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_DEBUG: ${FLASK_DEBUG:-false}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE_PATH: /var/log/file-manager/webui.log

    volumes:
      - logs:/var/log/file-manager
      - ./frontend:/app/frontend:ro

    networks:
      file-manager-internal:
        ipv4_address: 172.28.0.30

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    ports:
      - "${WEBUI_HOST_PORT:-3000}:3000"

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

# ==============================================================================
# Usage:
# ==============================================================================
# 1. Copy .env.example to .env and configure
# 2. Run: docker-compose up -d
# 3. Access WebUI at: http://localhost:3000
# 4. Access API at: http://localhost:8000
# 5. Default credentials: admin / admin123
#
# Management commands:
# - docker-compose logs -f              # View logs
# - docker-compose ps                   # View status
# - docker-compose down                 # Stop all services
# - docker-compose down -v              # Stop and remove volumes (DATA LOSS!)
# - docker-compose restart api          # Restart specific service
# - docker-compose exec api /bin/bash   # Shell into API container
# - docker-compose exec postgres psql -U filemanager  # PostgreSQL shell
# ==============================================================================
