<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Explorer - File Manager (VF Redesign)</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="explorer-page vf-redesign">
    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <h1>File Manager</h1>
        </div>
        <div class="header-right">
            <span class="user-info" id="user-info">
                <span class="user-name" id="user-name"></span>
                <span class="user-role" id="user-role"></span>
            </span>
            <button class="btn btn-secondary" id="admin-btn" style="display: none;">Admin Panel</button>
            <button class="btn btn-secondary" id="settings-btn">Settings</button>
            <button class="btn btn-secondary" id="logout-btn">Logout</button>
        </div>
    </header>

    <!-- Main Content - VF Redesign: Single Pane + Operation Queue -->
    <main class="main-content vf-layout">
        <div class="vf-container">
            <!-- Path A Pane (Single Pane) -->
            <div class="pane pane-single" id="pane-a">
                <div class="pane-header">
                    <h2>Path A</h2>
                    <div class="pane-controls">
                        <button class="btn-icon" id="refresh-a" title="Refresh">&#x21bb;</button>
                    </div>
                </div>

                <div class="breadcrumb-container">
                    <input type="text" class="breadcrumb-input" id="path-input-a" placeholder="A:/path/to/directory">
                    <button class="btn btn-sm" id="path-go-a">Go</button>
                </div>

                <div class="search-container">
                    <input type="text" class="search-input" id="search-a" placeholder="Search directories...">
                    <button class="btn btn-sm" id="search-btn-a">Search</button>
                </div>

                <div class="file-list-container">
                    <table class="file-list" id="file-list-a">
                        <thead>
                            <tr>
                                <th class="col-select"><input type="checkbox" id="select-all-a"></th>
                                <th class="col-name sortable" data-sort-by="name">
                                    Name <span class="sort-arrow"></span>
                                </th>
                                <th class="col-size sortable" data-sort-by="size">
                                    Size <span class="sort-arrow"></span>
                                </th>
                                <th class="col-modified sortable sorted-desc" data-sort-by="modified">
                                    Modified <span class="sort-arrow">▼</span>
                                </th>
                            </tr>
                        </thead>
                        <tbody id="file-list-body-a">
                            <!-- Directories will be loaded here -->
                        </tbody>
                    </table>
                    <div class="loading-indicator hidden" id="loading-a">Loading...</div>
                    <div class="no-files hidden" id="no-files-a">No directories found</div>
                    <button class="btn btn-secondary load-more hidden" id="load-more-a">Load More</button>
                </div>
            </div>

            <!-- Action Buttons (Between Panes) -->
            <div class="action-buttons-container">
                <button class="btn btn-primary btn-push" id="push-btn" title="Copy to PATH_B and archive to PATH_C" disabled>
                    Push &gt;
                </button>
                <button class="btn btn-secondary btn-pull" id="pull-btn" title="Revert selected operation from Operation Queue" disabled>
                    &lt; Pull
                </button>
            </div>

            <!-- Operation History (Right Side) -->
            <div class="operation-queue-panel" id="operation-queue-panel">
                <div class="queue-header">
                    <h2>Operation History</h2>
                    <div class="queue-search">
                        <input type="text" id="queue-search-input" class="search-input" placeholder="Search operations..." />
                        <button class="btn btn-sm" id="queue-search-btn">Search</button>
                        <button class="btn btn-sm" id="queue-clear-search-btn">Clear</button>
                    </div>
                    <div class="queue-controls">
                        <button class="btn-icon" id="refresh-queue" title="Refresh Queue">&#x21bb;</button>
                        <select id="queue-filter-status" class="filter-select" title="Filter by status">
                            <option value="">All Statuses</option>
                            <option value="PENDING">Pending</option>
                            <option value="IN_PROGRESS">In Progress</option>
                            <option value="COMPLETED">Completed</option>
                            <option value="FAILED">Failed</option>
                        </select>
                        <select id="queue-filter-type" class="filter-select" title="Filter by type">
                            <option value="">All Types</option>
                            <option value="PUSH">Push</option>
                            <option value="PULL">Pull</option>
                        </select>
                    </div>
                </div>

                <div class="queue-list-container">
                    <table class="queue-table" id="queue-table">
                        <thead>
                            <tr>
                                <th class="col-select"><input type="checkbox" id="select-operation" title="Select operation for Pull"></th>
                                <th class="col-id sortable" data-sort-by="id">
                                    ID <span class="sort-arrow"></span>
                                </th>
                                <th class="col-type sortable" data-sort-by="type">
                                    Type <span class="sort-arrow"></span>
                                </th>
                                <th class="col-status sortable" data-sort-by="status">
                                    Status <span class="sort-arrow"></span>
                                </th>
                                <th class="col-directory sortable" data-sort-by="directory">
                                    Directory <span class="sort-arrow"></span>
                                </th>
                                <th class="col-user sortable" data-sort-by="user">
                                    User <span class="sort-arrow"></span>
                                </th>
                                <th class="col-timestamp sortable sorted-desc" data-sort-by="timestamp">
                                    Timestamp <span class="sort-arrow">▼</span>
                                </th>
                            </tr>
                        </thead>
                        <tbody id="queue-table-body">
                            <!-- Operations will be loaded here -->
                        </tbody>
                    </table>
                    <div class="loading-indicator hidden" id="loading-queue">Loading operations...</div>
                    <div class="no-operations hidden" id="no-operations">No operations in history</div>
                    <button class="btn btn-secondary load-more hidden" id="load-more-queue">Load More</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Context Menu -->
    <div class="context-menu hidden" id="context-menu">
        <ul>
            <li data-action="open">Open</li>
            <li data-action="push">Push &gt;</li>
        </ul>
    </div>

    <!-- Modal for confirmations and inputs -->
    <div class="modal hidden" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Confirm Action</h3>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <p id="modal-message"></p>
                <div id="modal-input-container" class="hidden">
                    <input type="text" id="modal-input" class="form-control">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
                <button class="btn btn-primary" id="modal-confirm">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal hidden" id="settings-modal">
        <div class="modal-content modal-wide">
            <div class="modal-header">
                <h3 id="settings-modal-title">User Settings</h3>
                <button class="modal-close" id="settings-modal-close">&times;</button>
            </div>
            <div class="modal-body" id="settings-modal-body">
                <form id="settings-form">
                    <div class="settings-section">
                        <h4>Display Preferences</h4>

                        <div class="form-group">
                            <label for="ui-theme">Theme:</label>
                            <select id="ui-theme" name="ui_theme" class="form-control">
                                <option value="light">Light</option>
                                <option value="dark">Dark</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="show-hidden-files">
                                <input type="checkbox" id="show-hidden-files" name="show_hidden_files">
                                Show hidden files
                            </label>
                        </div>
                    </div>

                    <div class="settings-section">
                        <h4>File Listing</h4>

                        <div class="form-group">
                            <label for="default-sort-by">Default Sort By:</label>
                            <select id="default-sort-by" name="default_sort_by" class="form-control">
                                <option value="name">Name</option>
                                <option value="size">Size</option>
                                <option value="date">Date</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="default-sort-order">Sort Order:</label>
                            <select id="default-sort-order" name="default_sort_order" class="form-control">
                                <option value="asc">Ascending</option>
                                <option value="desc">Descending</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="items-per-page">Items Per Page:</label>
                            <input type="number" id="items-per-page" name="items_per_page" class="form-control" min="10" max="500" value="100">
                        </div>
                    </div>

                    <div class="settings-section">
                        <h4>Session Preferences</h4>

                        <div class="form-group">
                            <label for="remember-last-paths">
                                <input type="checkbox" id="remember-last-paths" name="remember_last_paths">
                                Remember last visited path
                            </label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="settings-reset">Reset to Defaults</button>
                <button class="btn btn-secondary" id="settings-cancel">Cancel</button>
                <button class="btn btn-primary" id="settings-save">Save</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="../js/app.js"></script>
</body>
</html>
