[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-file-manager"
version = "1.0.0"
description = "Enterprise file operations management with centralized control and distributed workers"
readme = "README_DATABASE.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Modular File Manager Team"}
]
keywords = ["file-management", "enterprise", "async", "fastapi", "postgresql"]

dependencies = [
    # Database
    "sqlalchemy[asyncio]==2.0.25",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",

    # Security
    "argon2-cffi==23.1.0",
    "cryptography==42.0.0",
    "pyjwt==2.8.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[argon2]==1.7.4",

    # API Framework
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "websockets==12.0",

    # Configuration
    "python-dotenv==1.0.0",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",

    # Redis
    "redis[hiredis]==5.0.1",

    # HTTP
    "httpx==0.26.0",
    "requests==2.31.0",

    # Utilities
    "loguru==0.7.2",
    "orjson==3.9.12",
    "python-dateutil==2.8.2",
    "pytz==2024.1",
    "aiofiles==23.2.1",
    "python-multipart==0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "pytest-mock==3.12.0",
    "pytest-cov==4.1.0",
    "black==24.1.1",
    "isort==5.13.2",
    "ruff==0.1.14",
    "mypy==1.8.0",
]

syslog = [
    "python-syslog==2.0.1",
]

celery = [
    "celery==5.3.6",
]

[project.scripts]
verify-schema = "verify_schema:main"

[tool.setuptools]
py-modules = ["models", "database", "verify_schema"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | alembic/versions
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["models", "database"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "argon2.*",
    "loguru.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/alembic/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
